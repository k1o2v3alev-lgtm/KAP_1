<!doctype html>
<html lang="ru">
<head>

<title>Кабинет учителя</title>
<style>
/* KAP engine · общие токены и компоненты. Единый облик всех продуктов (раздел 23.5). */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --surface2: #eef2f7; --ink: #1c2733; --muted: #5a6877; --line: #d5dde6;
  --brand: #1f5f99; --brand-ink: #ffffff; --ok: #1b7f4b; --ok-bg: #e3f4ea; --warn: #9a5b00; --warn-bg: #fff2d9;
  --bad: #a8321f; --bad-bg: #fbe7e3; --info-bg: #e6f0fa; --focus: #ffb000;
  --radius: 12px; --gap: 12px; --fs: 17px; --fs-small: 14px; --tap: 48px; --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #1a222b; --surface2: #222d38; --ink: #e8edf3; --muted: #a2b0bf; --line: #34424f;
    --brand: #6db3f2; --brand-ink: #0d1722; --ok: #5fd08f; --ok-bg: #173325; --warn: #f0b660; --warn-bg: #3a2c12;
    --bad: #ff8f7a; --bad-bg: #3d1d18; --info-bg: #1b2d40;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #1a222b; --surface2: #222d38; --ink: #e8edf3; --muted: #a2b0bf; --line: #34424f;
  --brand: #6db3f2; --brand-ink: #0d1722; --ok: #5fd08f; --ok-bg: #173325; --warn: #f0b660; --warn-bg: #3a2c12;
  --bad: #ff8f7a; --bad-bg: #3d1d18; --info-bg: #1b2d40;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--fs)/1.5 var(--font); }
.app { max-width: 920px; margin: 0 auto; padding: 16px; overflow-wrap: anywhere; }
h1 { font-size: 1.45em; margin: .2em 0 .4em; } h2 { font-size: 1.2em; margin: .2em 0 .4em; } h3 { font-size: 1.05em; margin: .2em 0; }
p { margin: .5em 0; }
.muted { color: var(--muted); } .small { font-size: var(--fs-small); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: var(--gap) 0; }
.row { display: flex; gap: var(--gap); flex-wrap: wrap; align-items: center; }

.grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }

.btn.ghost { background: transparent; color: var(--brand); }

.fr i { font-style: normal; padding: 0 .25em; border-bottom: 2px solid currentColor; } .fr b { font-weight: 600; padding: 0 .25em; }

/* KAP engine · кабинет учителя. */
.app { max-width: 1180px; }

@media print {
  @page { size: A4; margin: 8mm; }
  body { background: #fff; }
  .app { max-width: none; padding: 0; }
  .no-print { display: none !important; }
  .print-area { margin: 0; }
  .print-page { border: 0; border-radius: 0; margin: 0; padding: 6mm; max-width: none; page-break-after: always; break-after: page; }

}

/* --- core/util.js --- */

        var res = reps.map(addReport); A.log.push({ file: 'ручной ввод: ' + PP.kit.kitId + ' ' + PP.variant, family: 'paper_manual', n: reps.length, added: res.filter(function (x) { return x === 'added'; }).length, dup: res.filter(function (x) { return x === 'dup'; }).length, updated: res.filter(function (x) { return x === 'updated'; }).length, notes: [] });
        A.cache = {}; A.mode = 'analysis'; A.tab = 'classes'; A.cls = PP.kit.params['class']; A.msg = 'Результаты бумажной работы добавлены в анализ.'; render(); return;
      }
    }
  });
  appEl.addEventListener('change', function (e) {
