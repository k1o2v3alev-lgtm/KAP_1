<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мои уроки</title>
<style>
/* KAP engine · общие токены и компоненты. Единый облик всех продуктов (раздел 23.5). */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --surface2: #eef2f7; --ink: #1c2733; --muted: #5a6877; --line: #d5dde6;
  --brand: #1f5f99; --brand-ink: #ffffff; --ok: #1b7f4b; --ok-bg: #e3f4ea; --warn: #9a5b00; --warn-bg: #fff2d9;
  --bad: #a8321f; --bad-bg: #fbe7e3; --info-bg: #e6f0fa; --focus: #ffb000;
  --radius: 12px; --gap: 12px; --fs: 17px; --fs-small: 14px; --tap: 48px; --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #1a222b; --surface2: #222d38; --ink: #e8edf3; --muted: #a2b0bf; --line: #34424f;
    --brand: #6db3f2; --brand-ink: #0d1722; --ok: #5fd08f; --ok-bg: #173325; --warn: #f0b660; --warn-bg: #3a2c12;
    --bad: #ff8f7a; --bad-bg: #3d1d18; --info-bg: #1b2d40;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #1a222b; --surface2: #222d38; --ink: #e8edf3; --muted: #a2b0bf; --line: #34424f;
  --brand: #6db3f2; --brand-ink: #0d1722; --ok: #5fd08f; --ok-bg: #173325; --warn: #f0b660; --warn-bg: #3a2c12;
  --bad: #ff8f7a; --bad-bg: #3d1d18; --info-bg: #1b2d40;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--fs)/1.5 var(--font); }
.app { max-width: 920px; margin: 0 auto; padding: 16px; overflow-wrap: anywhere; }
h1 { font-size: 1.45em; margin: .2em 0 .4em; } h2 { font-size: 1.2em; margin: .2em 0 .4em; } h3 { font-size: 1.05em; margin: .2em 0; }
p { margin: .5em 0; }
.muted { color: var(--muted); } .small { font-size: var(--fs-small); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: var(--gap) 0; }
.row { display: flex; gap: var(--gap); flex-wrap: wrap; align-items: center; }
.row.sb { justify-content: space-between; }
.grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.btn { min-height: var(--tap); padding: 10px 18px; border-radius: 10px; border: 1px solid var(--brand); background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--brand); }
.btn.quiet { background: var(--surface2); color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
input[type=text], input[type=search], input[type=number], select, textarea { width: 100%; min-height: var(--tap); padding: 10px 12px; font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 10px; }
textarea { min-height: 120px; resize: vertical; }
label { display: block; font-weight: 600; margin: 10px 0 4px; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); font-size: var(--fs-small); }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); } .chip.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); } .chip.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.bar-track { height: 10px; border-radius: 999px; background: var(--surface2); overflow: hidden; border: 1px solid var(--line); }
.bar-fill { height: 100%; background: var(--brand); }
.note { background: var(--info-bg); border-left: 4px solid var(--brand); padding: 10px 14px; border-radius: 8px; margin: 10px 0; }
.note.warn { background: var(--warn-bg); border-left-color: var(--warn); } .note.bad { background: var(--bad-bg); border-left-color: var(--bad); } .note.ok { background: var(--ok-bg); border-left-color: var(--ok); }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-small); }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--surface2); }
.scroll { overflow-x: auto; max-width: 100%; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.1; margin: 0 .15em; }
.fr i { font-style: normal; padding: 0 .25em; border-bottom: 2px solid currentColor; } .fr b { font-weight: 600; padding: 0 .25em; }
.bars { display: flex; gap: 3px; margin: 10px 0; max-width: 420px; }
.bars .bar { flex: 1; height: 28px; border: 2px solid var(--brand); border-radius: 4px; background: var(--surface); }
.bars .bar.on { background: var(--brand); }
.modal-back { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); border-radius: var(--radius); padding: 18px; max-width: 520px; width: 100%; max-height: 90vh; overflow: auto; }
.sr-only { position: absolute; left: -9999px; }
@media print { body { background: #fff; color: #000; } .no-print { display: none !important; } }

/* KAP engine · интерфейс ученика. Возрастные оформления меняют плотность и размеры, но не структуру (п. 5, 23.5). */
.age-1-2 { --fs: 22px; --fs-small: 18px; --tap: 64px; --radius: 18px; }
.age-3-4 { --fs: 19px; --fs-small: 16px; --tap: 56px; }
.age-5-6 { --fs: 17px; }
.age-7-9 { --fs: 16px; }
.age-10-11 { --fs: 16px; --gap: 10px; }
.age-1-2 .hide-young, .age-3-4 .hide-young { display: none; }

.lesson-card { cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-height: var(--tap); }
.lesson-card:hover { border-color: var(--brand); }
.lesson-list .lesson-card { padding: 10px 14px; }
.status { font-weight: 700; margin-right: 6px; }
.status.s0 { color: var(--muted); } .status.s1 { color: var(--warn); } .status.s2 { color: var(--ok); }
.panel-total { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; text-align: center; }
.panel-total b { display: block; font-size: 1.6em; }

.runner-head { position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 5; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.dot.done { background: var(--brand); border-color: var(--brand); } .dot.cur { border-color: var(--brand); }
.dot.ok { background: var(--ok); border-color: var(--ok); } .dot.bad { background: var(--bad); border-color: var(--bad); }
.timer { font-variant-numeric: tabular-nums; }

.task-cond { font-size: 1.12em; margin: 8px 0 14px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; width: 100%; min-height: var(--tap); padding: 12px 14px; font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
.opt[aria-pressed="true"], .opt.sel { border-color: var(--brand); background: var(--info-bg); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); } .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.ord { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.ord li { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.ord li span.t { flex: 1; }
.ord button { min-width: var(--tap); min-height: 44px; font-size: 1.1em; }
.match-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; margin: 8px 0; }
@media (max-width: 420px) { .match-row { grid-template-columns: 1fr; } }

.fb { border-radius: var(--radius); padding: 12px 14px; margin: 12px 0; border: 1px solid var(--line); }
.fb.ok { background: var(--ok-bg); border-color: var(--ok); } .fb.bad { background: var(--bad-bg); border-color: var(--bad); } .fb.part { background: var(--warn-bg); border-color: var(--warn); } .fb.neutral { background: var(--info-bg); border-color: var(--brand); }
.fb h3 { margin-bottom: 4px; } .fb .line { margin: 4px 0; }
.hint { background: var(--warn-bg); border-left: 4px solid var(--warn); padding: 8px 12px; border-radius: 8px; margin: 8px 0; }
.emoji-row { display: flex; gap: 12px; flex-wrap: wrap; } .emoji-row .btn { font-size: 2em; padding: 6px 18px; }
.crit { margin: 6px 0; } .crit .bar-track { margin-top: 3px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.kv > div { background: var(--surface2); border-radius: 10px; padding: 8px 10px; } .kv b { display: block; font-size: 1.3em; }
.banner { background: var(--warn-bg); color: var(--warn); padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; font-size: var(--fs-small); }
.selftest table td.ok { color: var(--ok); } .selftest table td.bad { color: var(--bad); font-weight: 700; }

</style>
</head>
<body>
<div id="app" class="app" aria-live="polite"></div>
<script>
/* ядро */
/* --- core/util.js --- */
/* KAP engine · util: ГСЧ с seed, хеши, канонический JSON, время, экранирование. */
(function (root) {
  'use strict';
  var K = root.KAP = root.KAP || {};

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;

      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeRng(seed) {
    var f = mulberry32(seed);
    return {
      seed: seed >>> 0,
      next: f,
      int: function (a, b) { return a + Math.floor(f() * (b - a + 1)); },
      pick: function (arr) { return arr[Math.floor(f() * arr.length)]; },
      chance: function (p) { return f() < p; },
      shuffle: function (arr) {
        var x = arr.slice();
        for (var i = x.length - 1; i > 0; i--) {
          var j = Math.floor(f() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t;

  }

  function cyrb53(str, seed) {
    seed = seed || 0;

    for (var i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);

  function hashHex(str) { var s = cyrb53(String(str)).toString(16); while (s.length < 14) s = '0' + s; return s; }
  function deriveSeed(base, label) { return cyrb53(String(base) + '|' + String(label)) >>> 0; }

  function randomSeed() {
    try {
      var a = new Uint32Array(1); root.crypto.getRandomValues(a); return a[0];
    } catch (e) { return (Date.now() ^ Math.floor(Math.random() * 4294967296)) >>> 0; }
  }
  function uuid() {
    try { if (root.crypto && root.crypto.randomUUID) return root.crypto.randomUUID(); } catch (e) { /* ниже запасной */ }

    return s.slice(0, 8) + '-' + s.slice(8, 12) + '-4' + s.slice(13, 16) + '-a' + s.slice(17, 20) + '-' + s.slice(20, 32);
  }

  function canonical(o) {
    if (o === null || typeof o !== 'object') return JSON.stringify(o === undefined ? null : o);
    if (Array.isArray(o)) return '[' + o.map(canonical).join(',') + ']';
    return '{' + Object.keys(o).sort().map(function (k) { return JSON.stringify(k) + ':' + canonical(o[k]); }).join(',') + '}';
  }

  function sha256Hex(str) {
    try {
      if (root.crypto && root.crypto.subtle) {
        return root.crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
          return { algorithm: 'SHA-256', hash: Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('') };
        });
      }
    } catch (e) { /* запасной вариант */ }
    return Promise.resolve({ algorithm: 'cyrb53', hash: hashHex(str) });
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function nowIso(d) {
    d = d || new Date();
    var off = -d.getTimezoneOffset(), sign = off >= 0 ? '+' : '-'; off = Math.abs(off);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + sign + pad(Math.floor(off / 60)) + ':' + pad(off % 60);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function clone(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
  function round1(x) { return Math.round(x * 10) / 10; }
  function round2(x) { return Math.round(x * 100) / 100; }
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a; }
  function sum(arr) { var s = 0; for (var i = 0; i < arr.length; i++) s += arr[i]; return s; }

  K.util = { mulberry32: mulberry32, makeRng: makeRng, cyrb53: cyrb53, hashHex: hashHex, deriveSeed: deriveSeed, randomSeed: randomSeed, uuid: uuid, canonical: canonical, sha256Hex: sha256Hex, nowIso: nowIso, esc: esc, clone: clone, round1: round1, round2: round2, gcd: gcd, sum: sum };
})(typeof window !== 'undefined' ? window : globalThis);

/* --- core/normalize.js --- */
/* KAP engine · normalize: нормализация текста и чисел, точные дроби, системы счисления. */
(function (root) {
  'use strict';
  var K = root.KAP = root.KAP || {};
  var gcd = K.util.gcd;

  // Латинские двойники кириллических букв (проверка по строчным).
  var LOOK = { a: 'а', c: 'с', e: 'е', o: 'о', p: 'р', x: 'х', y: 'у', i: 'і', k: 'к', m: 'м', t: 'т' };

  /** mode: default | orthography | exact */
  function normText(s, mode) {
    s = String(s == null ? '' : s).normalize('NFC').replace(/[   ]/g, ' ').trim().replace(/\s+/g, ' ');
    if (mode === 'exact') return s;
    s = s.toLowerCase();
    if (mode === 'orthography') return s;               // ә ≠ а, қ ≠ к, ү ≠ у
    s = s.replace(/ё/g, 'е').replace(/[.,;:!?]+$/, '');
    return s.replace(/[a-z]/g, function (c) { return LOOK[c] || c; });
  }

  // ---- рациональные числа ----
  function rat(n, d) {
    if (d === 0) return null;
    if (d < 0) { n = -n; d = -d; }
    var g = gcd(n, d) || 1;
    return { n: n / g, d: d / g };
  }
  function ratEq(a, b) { return !!a && !!b && a.n === b.n && a.d === b.d; }
  function ratAdd(a, b) { return rat(a.n * b.d + b.n * a.d, a.d * b.d); }
  function ratSub(a, b) { return rat(a.n * b.d - b.n * a.d, a.d * b.d); }
  function ratMul(a, b) { return rat(a.n * b.n, a.d * b.d); }
  function ratToStr(r) { return r.d === 1 ? String(r.n) : r.n + '/' + r.d; }

  /** Разбор числа: целое, десятичное (точка/запятая), дробь a/b, смешанное "1 1/2". Возвращает {n,d,form,reduced} либо null. */
  function parseNumber(str) {
    var s = String(str == null ? '' : str).replace(/[−–]/g, '-').replace(/[   ]/g, ' ').trim();
    if (!s) return null;
    var m, r;
    if ((m = /^([+-]?)(\d{1,9})\s+(\d{1,9})\s*\/\s*(\d{1,9})$/.exec(s))) {
      var w = +m[2], a = +m[3], b = +m[4]; if (b === 0) return null;
      r = rat((m[1] === '-' ? -1 : 1) * (w * b + a), b); r.form = 'mixed'; r.reduced = gcd(a, b) === 1; return r;
    }
    if ((m = /^([+-]?\d{1,9})\s*\/\s*(\d{1,9})$/.exec(s))) {
      var n0 = +m[1], d0 = +m[2]; if (d0 === 0) return null;
      r = rat(n0, d0); r.form = 'fraction'; r.reduced = gcd(n0, d0) === 1; return r;
    }
    if ((m = /^([+-]?)(\d{1,9})(?:[.,](\d{1,9}))?$/.exec(s))) {
      var frac = m[3] || '', den = Math.pow(10, frac.length);
      r = rat((m[1] === '-' ? -1 : 1) * (+(m[2] + frac)), den); r.form = frac ? 'decimal' : 'integer'; r.reduced = true; return r;
    }
    return null;
  }

  /** Число в системе счисления base (2..36) из строки; разделители групп и префиксы 0b/0x допускаются. */
  function parseInBase(str, base) {
    var s = String(str == null ? '' : str).trim().toLowerCase().replace(/[\s_']/g, '');
    s = s.replace(/^0b/, '').replace(/^0x/, '').replace(/^0o/, '');
    if (!s) return null;
    var digits = '0123456789abcdefghijklmnopqrstuvwxyz', v = 0;
    for (var i = 0; i < s.length; i++) {
      var d = digits.indexOf(s[i]);
      if (d < 0 || d >= base) return null;
      v = v * base + d;
      if (v > 9007199254740991) return null;
    }
    return v;
  }

  K.norm = { normText: normText, rat: rat, ratEq: ratEq, ratAdd: ratAdd, ratSub: ratSub, ratMul: ratMul, ratToStr: ratToStr, parseNumber: parseNumber, parseInBase: parseInBase };
})(typeof window !== 'undefined' ? window : globalThis);

/* --- core/expr.js --- */
/* KAP engine · expr: безопасный разбор алгебраических выражений (AST) без eval и new Function.
   Проверка эквивалентности записей по набору контрольных точек. */
(function (root) {
  'use strict';
  var K = root.KAP = root.KAP || {};

  function tokenize(src) {
    var s = String(src == null ? '' : src)
      .replace(/[−–—]/g, '-').replace(/[·×∙⋅]/g, '*').replace(/÷/g, '/')
      .replace(/²/g, '^2').replace(/³/g, '^3').replace(/[хХ]/g, 'x').replace(/\s+/g, '').toLowerCase();
    var toks = [], i = 0, m;
    while (i < s.length) {
      var c = s[i];
      if ((m = /^\d+(?:[.,]\d+)?/.exec(s.slice(i)))) { toks.push({ t: 'n', v: parseFloat(m[0].replace(',', '.')) }); i += m[0].length; }
      else if (/[a-z]/.test(c)) { toks.push({ t: 'v', v: c }); i++; }
      else if ('+-*/^()'.indexOf(c) >= 0) { toks.push({ t: c }); i++; }
      else throw new Error('bad char ' + c);
    }
    return toks;
  }

  function parse(src) {
    var toks = tokenize(src), p = 0;
    function peek() { return toks[p]; }
    function startsFactor(t) { return t && (t.t === 'n' || t.t === 'v' || t.t === '('); }
    function expr() {
      var a = term();
      while (peek() && (peek().t === '+' || peek().t === '-')) { var op = toks[p++].t; a = { t: 'bin', op: op, a: a, b: term() }; }
      return a;
    }
    function term() {
      var a = unary();
      for (;;) {
        var k = peek();
        if (k && (k.t === '*' || k.t === '/')) { p++; a = { t: 'bin', op: k.t, a: a, b: unary() }; }
        else if (startsFactor(k)) { a = { t: 'bin', op: '*', a: a, b: unary() }; }
        else break;
      }
      return a;
    }
    function unary() {
      var k = peek();
      if (k && k.t === '-') { p++; return { t: 'neg', a: unary() }; }
      if (k && k.t === '+') { p++; return unary(); }
      return power();
    }
    function power() {
      var a = atom();
      if (peek() && peek().t === '^') { p++; return { t: 'bin', op: '^', a: a, b: unary() }; }
      return a;
    }
    function atom() {
      var k = toks[p++];
      if (!k) throw new Error('unexpected end');
      if (k.t === 'n') return { t: 'n', v: k.v };
      if (k.t === 'v') return { t: 'v', v: k.v };
      if (k.t === '(') { var e = expr(); if (!peek() || peek().t !== ')') throw new Error('missing )'); p++; return e; }
      throw new Error('unexpected ' + k.t);

  function runSelftest(n) {
    var out = document.getElementById('stOut'); if (!out) return;

    (function step() {

        var d = list[i][0], p = list[i][1], st = K.gen.test(d.id, n || 300, { profile: p });
        rows.push('<tr><td>' + esc(d.id) + '</td><td>' + esc(d.version) + '</td><td>' + p + '</td><td>' + st.tried + '</td><td>' + st.accepted + '</td><td>' + st.rejected + '</td><td>' + st.uniqueVariants + '</td><td class="' + (st.verdict.ok ? 'ok' : 'bad') + '">' + (st.verdict.ok ? 'OK' : esc(st.verdict.problems.join('; '))) + '</td></tr>');

        '<p>Хранилище браузера: <b class="' + (storage ? 'ok' : 'bad') + '">' + (storage ? 'работает' : 'недоступно') + '</b></p><p>Служебные слова на экранах ученика: <b class="' + (jarg.length ? 'bad' : 'ok') + '">' + (jarg.length ? esc(jarg.join(', ')) : 'нет') + '</b></p><p>Версии: ядро ' + esc(K.PRODUCER.engineVersion) + ', содержание ' + esc(K.PRODUCER.contentVersion) + ', контрольная сумма ' + esc(K.PRODUCER.contentHash) + '</p>';

      case 'skip': { c = currentTaskObj(); skipTask(c.at, c.L, c.stage, c.task); render(); return; }
      case 'nextTask': {
        c = currentTaskObj(); ui.draft = null; ui.hideFb = null;
        if (c.at.taskIdx + 1 >= c.tasks.length) { afterTasks(); return; }
        c.at.taskIdx++; save(); render(); return;
      }
      case 'seriesYes': { c = currentTaskObj(); var weak = ui.modal.weak; ui.modal = null; startSeries(c.at, c.L, c.stage, weak); ui.draft = null; save(); render(); return; }
      case 'seriesNo': ui.modal = null; advance(); render(); return;
      case 'rfEmoji': case 'rfChoice': { appEl.querySelectorAll('[data-act="' + act + '"]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); x.classList.remove('sel'); }); b.setAttribute('aria-pressed', 'true'); b.classList.add('sel'); b.setAttribute('data-picked', '1'); return; }
      case 'rfNext': { appEl.querySelectorAll('[data-act="rfNext"]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); x.classList.remove('sel'); x.removeAttribute('data-picked'); }); b.setAttribute('aria-pressed', 'true'); b.classList.add('sel'); b.setAttribute('data-picked', '1'); return; }
      case 'finish': {
        var form = b.getAttribute('data-form'), pick = appEl.querySelector('[data-act="rfEmoji"][data-picked],[data-act="rfChoice"][data-picked]'), nx = appEl.querySelector('[data-act="rfNext"][data-picked]'), err = document.getElementById('rerr');
        var scale = document.getElementById('rscale'), txt = document.getElementById('rtext');
        if (!nx || ((form === 'emoji' || form === 'choice_text') && !pick)) { err.style.display = 'block'; err.textContent = T('reflect.chooseOne'); return; }
        c = currentTaskObj() || { at: activeAttempt(), L: lessonById(ui.lessonId) };
        c.at.reflection = { form: form, answers: { feel: pick ? +pick.getAttribute('data-v') : null, scale: scale ? +scale.value : null, text: txt ? txt.value : null }, nextStep: +nx.getAttribute('data-v') };
        var st = c.L.stages[c.at.stageIdx]; stageStateOf(c.at, st.id).status = 'completed'; stageStateOf(c.at, st.id).finishedAt = U.nowIso();
        c.at.stageIdx++; completeAttempt(c.at, c.L); render(); return;
      }
      case 'runSelftest': runSelftest(600); return;
    }
  });
  appEl.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'ans') { ui.draft = t.value; }
    if (t.id === 'flt') { ui.filter = t.value; var pos = t.selectionStart; render(); var f = document.getElementById('flt'); if (f) { f.focus(); f.setSelectionRange(pos, pos); } }
  });
  appEl.addEventListener('change', function (e) { if (e.target.hasAttribute('data-match')) { var c = currentTaskObj(); if (c) { c.task.answerChanges++; ui.draft = readDraft(c.task); } } });
  appEl.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'ans' && e.target.tagName === 'INPUT') { var btn = appEl.querySelector('[data-act="check"],[data-act="retry"]'); if (btn) btn.click(); } });
  root.addEventListener('hashchange', render);

  // ================= отладочный интерфейс (для испытаний) =================
  function autoplay(lessonId, o) {
    o = o || {}; var L = lessonById(lessonId);
    if (!P()) { var id = 'ptest'; state.profiles[id] = { studentId: id, name: o.name || 'Тест Тестов', 'class': o['class'] || '6А', createdAt: U.nowIso(), lessons: {} }; state.current = id; }
    ui.lessonId = lessonId;
    var at = newAttempt(L), rng = U.makeRng(o.seed || 7);
    while (at.stageIdx < L.stages.length) {
      var stage = L.stages[at.stageIdx];
      if (stage.type === 'tasks') {
        if (stage.group === 'club' && o.skipClub !== false) { stageStateOf(at, stage.id).status = 'skipped'; at.stageIdx++; if (L.stages[at.stageIdx]) enterStage(at, L, L.stages[at.stageIdx]); continue; }
        if (stage.group === 'final' && o.skipFinal) { stageStateOf(at, stage.id).status = 'skipped'; at.stageIdx++; if (L.stages[at.stageIdx]) enterStage(at, L, L.stages[at.stageIdx]); continue; }
        beginStage(at, L, stage);
        stageTasks(at, stage).forEach(function (t) {
          t.presentedAt = U.nowIso(); t.openedCount = 1;
          var good = rng.next() < (o.accuracy != null ? o.accuracy : 0.8), n = 0;
          if (t.taskType === 'open') { answerTask(at, L, stage, t, 'Ответ ученика для проверки учителем'); return; }
          while (!t.closed && n++ < 4) {
            var ans = good ? t.correctAnswer : (t.taskType === 'single_choice' ? Object.keys(t.distractorMap)[0] : t.taskType === 'ordering' ? t.rule.order.slice().reverse() : t.taskType === 'multi_choice' ? [] .concat('o99') : t.taskType === 'matching' ? {} : 'неверно');
            if (!good && t.taskType === 'matching') ans = { x: 'y' };
            answerTask(at, L, stage, t, ans);
          }
        });
        if (stage.group === 'final') stageStateOf(at, stage.id).activeSec = o.finalActiveSec != null ? o.finalActiveSec : 60;
        var ss = stageStateOf(at, stage.id); ss.status = 'completed'; ss.finishedAt = U.nowIso();
      } else if (stage.type === 'reflection') {
        at.reflection = { form: 'text', answers: { feel: 2, scale: 4, text: 'автотест' }, nextStep: 2 };
        stageStateOf(at, stage.id).status = 'completed';
      } else { stageStateOf(at, stage.id).status = 'completed'; }
      at.stageIdx++; if (L.stages[at.stageIdx]) enterStage(at, L, L.stages[at.stageIdx]);
    }
    at.activeSec = o.activeSec != null ? o.activeSec : 300;
    completeAttempt(at, L); return reportOf(at, L);
  }

  K.app = {
    state: function () { return state; }, ui: ui, render: render,
    debug: {
      autoplay: autoplay, reset: function () { state = emptyState(); save(); ui.view = 'home'; render(); },
      setFinalLimit: function (id, sec) { var L = lessonById(id); L.timeLimitSec = L.timeLimitSec || {}; L.timeLimitSec.final = sec; render(); },
      report: function () { var at = curAttempt(), L = lessonById(ui.lessonId); return at && L ? reportOf(at, L) : null; },
      setActiveSec: function (stageId, sec) { var at = curAttempt(); if (at) { stageStateOf(at, stageId).activeSec = sec; save(); } },
      lessons: function () { return LESSONS; }, forbiddenUi: FORBIDDEN_UI
    }
  };
  render();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
